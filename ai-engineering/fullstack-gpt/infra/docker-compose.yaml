services:
    litellm:
      image: docker.litellm.ai/berriai/litellm:main-latest
      command:
        - --config
        - /app/litellm_config.yaml
        - --port
        - "4000"

      ports:
        - "127.0.0.1:4000:4000"

      volumes:
        - ./litellm_config.yaml:/app/litellm_config.yaml:ro

      env_file:
        - ../.env

      restart: unless-stopped
